name: Build Linux

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip xclip xsel xvfb
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
    - name: Install project dependencies
      run: |
        poetry install
        poetry run pip install pyinstaller
    - name: Build with PyInstaller
      run: |
        xvfb-run poetry run pyinstaller --name "MenstrualTracker" --windowed --onefile main.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MenstrualTracker-Linux
        path: dist/MenstrualTracker
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/MenstrualTracker
