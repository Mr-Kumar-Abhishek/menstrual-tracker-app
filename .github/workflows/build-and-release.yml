name: Build and Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.tag_version.outputs.new_tag != ''
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip xclip xsel xvfb ruby ruby-dev rubygems build-essential rpm
        sudo gem install fpm
    - name: Install Poetry
      run: curl -sSL https://install.python-poetry.org | python3 -
    - name: Install project dependencies
      run: |
        poetry install
        poetry run pip install pyinstaller
    - name: Build with PyInstaller
      run: xvfb-run poetry run pyinstaller --name "MenstrualTracker" --windowed --onefile main.py
    - name: Verify Linux Build
      run: |
        test -x dist/MenstrualTracker
        [ $(stat -c%s "dist/MenstrualTracker") -gt 1000000 ]
    - name: Build DEB and RPM Packages
      run: |
        mkdir -p package/usr/local/bin
        cp dist/MenstrualTracker package/usr/local/bin/menstrual-tracker
        fpm -s dir -t deb -n menstrual-tracker -v ${{ needs.version.outputs.new_tag || '1.0.0' }} -C package .
        fpm -s dir -t rpm -n menstrual-tracker -v ${{ needs.version.outputs.new_tag || '1.0.0' }} -C package .
    - name: Build AppImage
      run: |
        mkdir -p AppDir/usr/bin
        cp dist/MenstrualTracker AppDir/usr/bin/menstrual-tracker
        ln -s usr/bin/menstrual-tracker AppDir/AppRun
        echo -e "[Desktop Entry]\nType=Application\nName=Menstrual Tracker\nExec=menstrual-tracker\nIcon=menstrual-tracker\nCategories=Utility;" > AppDir/menstrual-tracker.desktop
        touch AppDir/menstrual-tracker.png
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        # Extract appimagetool (sometimes required in CI)
        ./appimagetool-x86_64.AppImage --appimage-extract
        export PATH=$(pwd)/squashfs-root/usr/bin:$PATH
        ./squashfs-root/AppRun AppDir MenstrualTracker-x86_64.AppImage
    - name: Generate Hashes
      run: |
        md5sum dist/MenstrualTracker *.deb *.rpm *.AppImage > md5sums-linux.txt
        sha256sum dist/MenstrualTracker *.deb *.rpm *.AppImage > sha256sums-linux.txt
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MenstrualTracker-Linux-All
        path: |
          dist/MenstrualTracker
          *.deb
          *.rpm
          *.AppImage
          md5sums-linux.txt
          sha256sums-linux.txt
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.new_tag }}
        files: |
          dist/MenstrualTracker
          *.deb
          *.rpm
          *.AppImage
          md5sums-linux.txt
          sha256sums-linux.txt

  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Poetry
      run: pip install poetry
    - name: Install dependencies
      run: |
        poetry install
        poetry run pip install pyinstaller
    - name: Build with PyInstaller
      env:
        KIVY_GL_BACKEND: mock
      run: poetry run pyinstaller --name "MenstrualTracker" --windowed --onefile main.py
    - name: Verify Windows Build
      run: |
        if (!(Test-Path dist\MenstrualTracker.exe)) { exit 1 }
        $size = (Get-Item dist\MenstrualTracker.exe).length
        if ($size -lt 1000000) { exit 1 }
    - name: Generate Hashes
      run: |
        (Get-FileHash -Algorithm MD5 dist\MenstrualTracker.exe).Hash + "  dist\MenstrualTracker.exe" > md5sums-windows.txt
        (Get-FileHash -Algorithm SHA256 dist\MenstrualTracker.exe).Hash + "  dist\MenstrualTracker.exe" > sha256sums-windows.txt
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MenstrualTracker-Windows
        path: |
          dist/MenstrualTracker.exe
          md5sums-windows.txt
          sha256sums-windows.txt
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.new_tag }}
        files: |
          dist/MenstrualTracker.exe
          md5sums-windows.txt
          sha256sums-windows.txt

  build-android:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-global-${{ runner.os }}-

    - name: Cache Buildozer project directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-project-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-project-${{ runner.os }}-

    - name: Install Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake gettext libltdl-dev libtool-bin
        pip install --user --upgrade buildozer cython virtualenv

    - name: Pre-download and extract freetype (Savannah 502 workaround)
      run: |
        wget -O freetype-2.14.1.tar.gz https://mirror.csclub.uwaterloo.ca/nongnu/freetype/freetype-2.14.1.tar.gz
        tar -xzf freetype-2.14.1.tar.gz

    - name: Build Release AAB with Buildozer
      env:
        P4A_freetype_DIR: ${{ github.workspace }}/freetype-2.14.1
      run: yes | ~/.local/bin/buildozer android release

    - name: Prepare AAB for Signing
      run: |
        mkdir -p release_aab
        find . -name '*-release*.aab' -exec cp {} release_aab/anonymous.menstrual.tracker.mrkumar-release-unsigned.aab \;
        ls -la release_aab/

    - name: Sign Android Release
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: release_aab
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Rename Signed AAB
      run: |
        mkdir -p bin
        mv ${{steps.sign_app.outputs.signedReleaseFile}} bin/anonymous.menstrual.tracker.mrkumar-signed.aab

    - name: Generate Hashes
      run: |
        md5sum bin/*-signed.aab > md5sums-android.txt
        sha256sum bin/*-signed.aab > sha256sums-android.txt

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MenstrualTracker-Android
        path: |
          bin/*-signed.aab
          md5sums-android.txt
          sha256sums-android.txt

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.new_tag }}
        files: |
          bin/*-signed.aab
          md5sums-android.txt
          sha256sums-android.txt

  build-ios:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        brew install autoconf automake libtool pkg-config
        pip install kivy-ios cython virtualenv
    - name: Build Kivy iOS toolchain
      run: |
        toolchain build python3 kivy
    - name: Create Xcode Project
      run: |
        mkdir app_source
        cp -r main.py app/ app_source/
        toolchain create MenstrualTracker app_source
    - name: Build Xcode Archive (unsigned)
      run: |
        cd menstrualtracker-ios
        xcodebuild archive -project menstrualtracker.xcodeproj -scheme menstrualtracker -configuration Release -archivePath menstrualtracker.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
        cd ..
        tar -czvf MenstrualTracker-iOS.xcarchive.tar.gz menstrualtracker-ios/menstrualtracker.xcarchive
    - name: Generate Hashes
      run: |
        md5 -r MenstrualTracker-iOS.xcarchive.tar.gz > md5sums-ios.txt
        shasum -a 256 MenstrualTracker-iOS.xcarchive.tar.gz > sha256sums-ios.txt
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MenstrualTracker-iOS
        path: |
          MenstrualTracker-iOS.xcarchive.tar.gz
          md5sums-ios.txt
          sha256sums-ios.txt
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.new_tag }}
        files: |
          MenstrualTracker-iOS.xcarchive.tar.gz
          md5sums-ios.txt
          sha256sums-ios.txt
