name: Build Debug APK (Emulator)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-debug-global-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'icon.png') }}
          restore-keys: |
            buildozer-debug-global-${{ runner.os }}-

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-debug-project-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'icon.png') }}
          restore-keys: |
            buildozer-debug-project-${{ runner.os }}-

      - name: Install Buildozer system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev \
            automake gettext \
            libltdl-dev libtool-bin
          pip install --user --upgrade buildozer cython virtualenv

      - name: Pre-download freetype (Savannah 502 workaround)
        run: |
          mkdir -p /tmp/freetype
          wget -O /tmp/freetype/freetype-2.14.1.tar.gz \
            https://mirror.csclub.uwaterloo.ca/nongnu/freetype/freetype-2.14.1.tar.gz
          tar -xzf /tmp/freetype/freetype-2.14.1.tar.gz -C /tmp/freetype/
          rm -rf freetype-2.14.1 freetype-2.14.1.tar.gz

      - name: Build Debug APK with Buildozer
        env:
          P4A_freetype_DIR: /tmp/freetype/freetype-2.14.1
          LDFLAGS: "-Wl,-z,max-page-size=65536"
          P4A_EXTRA_LDFLAGS: "-Wl,-z,max-page-size=65536"
        run: yes | ~/.local/bin/buildozer android debug

      - name: Locate and collect APK
        run: |
          mkdir -p bin
          find . -name '*.apk' -not -path './.buildozer/*' | head -5
          find . -name '*debug*.apk' -exec cp {} bin/ \; 2>/dev/null || true
          find .buildozer -name '*debug*.apk' -exec cp {} bin/ \; 2>/dev/null || true
          ls -lh bin/

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenstrualTracker-Debug-APK
          path: bin/*.apk
          retention-days: 7
