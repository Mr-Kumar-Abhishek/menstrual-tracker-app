name: Build Android

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake gettext libltdl-dev libtool-bin
        pip install --user --upgrade buildozer cython virtualenv
    - name: Prepare requirements
      run: |
        pip install poetry
        poetry export -f requirements.txt --output requirements.txt || true
    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then ~/.local/bin/buildozer init; fi
        # Set app title and package name
        sed -i 's/^title = My Application/title = MenstrualTracker/' buildozer.spec
        sed -i 's/^package.name = myapp/package.name = menstrualtracker/' buildozer.spec
        sed -i 's/^package.domain = org.test/package.domain = com.mrkumar/' buildozer.spec
        # Inject dependencies into buildozer spec dynamically
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,kivymd,plyer/' buildozer.spec
        # Force NDK 25b and auto-accept licenses to fix NDK r28c / libffi build errors
        echo "android.ndk = 25b" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        yes | ~/.local/bin/buildozer android debug
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MenstrualTracker-Android
        path: bin/*.apk
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*.apk
